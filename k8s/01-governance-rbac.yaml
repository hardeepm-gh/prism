apiVersion: v1
kind: ServiceAccount
metadata:
  name: correlator-sa
  namespace: aiops-m5
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: correlator-role
  namespace: aiops-m5
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: correlator-rb
  namespace: aiops-m5
subjects:
- kind: ServiceAccount
  name: correlator-sa
  namespace: aiops-m5
roleRef:
  kind: Role
  name: correlator-role
  apiGroup: rbac.authorization.k8s.io
---
