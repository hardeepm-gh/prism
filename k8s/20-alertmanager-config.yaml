apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: aiops-m5
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "root_correlation_key"]
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 12h
      receiver: "prism-correlator"
    receivers:
    - name: "prism-correlator"
      webhook_configs:
      - url: "http://correlator:8089/webhook"
        send_resolved: true
        http_config:
          bearer_token_file: /etc/prism-key/api-key
