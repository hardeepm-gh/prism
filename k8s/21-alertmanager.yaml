apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: aiops-m5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
      - name: alertmanager
        image: prom/alertmanager:v0.27.0
        args: ["--config.file=/etc/alertmanager/alertmanager.yml","--storage.path=/alertmanager"]
        ports:
        - containerPort: 9093
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 65534
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: config
          mountPath: /etc/alertmanager
        - name: data
          mountPath: /alertmanager
        - name: prism-key
          mountPath: /etc/prism-key
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: alertmanager-config
      - name: data
        emptyDir: {}
      - name: prism-key
        secret:
          secretName: prism-secrets
          items:
          - key: PRISM_API_KEY
            path: api-key
