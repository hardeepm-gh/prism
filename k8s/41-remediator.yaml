apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediator
  namespace: aiops-m5
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: remediator
  template:
    metadata:
      labels:
        app: remediator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: remediator
        image: prism-remediator:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef:
            name: prism-secrets
        ports:
        - containerPort: 8090
        volumeMounts:
        - name: audit-data
          mountPath: /data
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: audit-data
        persistentVolumeClaim:
          claimName: prism-audit-pvc
