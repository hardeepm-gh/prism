apiVersion: apps/v1
kind: Deployment
metadata:
  name: cockpit
  namespace: aiops-m5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cockpit
  template:
    metadata:
      labels:
        app: cockpit
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: cockpit
        image: prism-cockpit:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8095
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
