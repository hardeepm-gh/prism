apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-glpi-to-mariadb
  namespace: aiops-m5
spec:
  podSelector:
    matchLabels:
      app: glpi-mariadb
  policyTypes: ["Ingress"]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: glpi
    ports:
    - port: 3306
      protocol: TCP
