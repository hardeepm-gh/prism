apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-correlator-to-glpi
  namespace: aiops-m5
spec:
  podSelector:
    matchLabels:
      app: glpi
  policyTypes: ["Ingress"]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: correlator
    ports:
    - port: 80
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-correlator-egress-to-glpi
  namespace: aiops-m5
spec:
  podSelector:
    matchLabels:
      app: correlator
  policyTypes: ["Egress"]
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: glpi
    ports:
    - port: 80
      protocol: TCP
